name: CI/CD Frontend Despachos

on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build imagen Docker
        run: |
          docker build \
            --build-arg VITE_API_URL=http://${{ secrets.BACKEND_PRIVATE_IP }}:8081 \
            -t despacho-frontend .

      - name: Tag y Push a ECR
        run: |
          docker tag despacho-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest
          docker tag despacho-frontend:latest ${{ secrets.ECR_REPO_URL_FRONTEND }}:${{ github.sha }}
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:latest
          docker push ${{ secrets.ECR_REPO_URL_FRONTEND }}:${{ github.sha }}

      - name: Deploy en EC2 Frontend via SSM
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPO_URL: ${{ secrets.ECR_REPO_URL_FRONTEND }}
          INSTANCE_ID: ${{ secrets.EC2_FRONTEND_INSTANCE_ID }}
        run: |
          COMMAND="aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY} && docker pull ${ECR_REPO_URL}:latest && docker stop despacho-frontend || true && docker rm despacho-frontend || true && docker run -d --name despacho-frontend -p 80:80 --restart unless-stopped ${ECR_REPO_URL}:latest"
          aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands=["${COMMAND}"] \
            --region "${AWS_REGION}"
